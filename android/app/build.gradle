plugins {
    id 'com.android.application'
}

android {
    namespace 'com.novadrift.gacha'
    compileSdk 34

    defaultConfig {
        applicationId "com.novadrift.gacha"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0-prototype"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            // Prototype builds are signed with the debug key so the APK is
            // installable straight off the box. Swap in a real keystore before
            // anything leaves the lab.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nova Drift</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Icon sprite. Every item row in data.js points at one of these symbols,
     which is this prototype's replacement for a Texture2D per item. -->
<svg class="sprite" aria-hidden="true">
  <defs>
    <g id="g-stroke" fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round" stroke-linejoin="round"></g>
  </defs>

  <symbol id="ic-rifle" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 11h13l2-2h5"/><path d="M6 11v4"/><path d="M10.5 11v2.5"/><path d="M2 11v2.5h3"/></g></symbol>
  <symbol id="ic-pistol" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13v4h-4l-2 6H8l1-6H4z"/></g></symbol>
  <symbol id="ic-blade" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19l9-14 2.5 3.5-8 12z"/><path d="M4.5 16.5l4 4"/></g></symbol>
  <symbol id="ic-cannon" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h11l6 3-6 3H3z"/><path d="M8 9v6M12 9v6"/></g></symbol>
  <symbol id="ic-drone" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8l4 4-4 4-4-4z"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M6.5 6.5L9.5 9.5M17.5 6.5L14.5 9.5M6.5 17.5L9.5 14.5M17.5 17.5L14.5 14.5"/></g></symbol>
  <symbol id="ic-core" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 4.5v9L12 21l-7.5-4.5v-9z"/><circle cx="12" cy="12" r="3.2"/></g></symbol>
  <symbol id="ic-shield" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g></symbol>
  <symbol id="ic-helm" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11a7 7 0 0114 0v5a4 4 0 01-4 4H9a4 4 0 01-4-4z"/><path d="M8 12.5h8"/><path d="M12 16.5V20"/></g></symbol>
  <symbol id="ic-visor" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18v3a3 3 0 01-3 3H6a3 3 0 01-3-3z"/><path d="M3 10l3-4h12l3 4"/></g></symbol>
  <symbol id="ic-reactor" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="9" ry="4.2"/><ellipse cx="12" cy="12" rx="9" ry="4.2" transform="rotate(60 12 12)"/></g></symbol>

  <symbol id="ic-chronite" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l6 5-6 13-6-13z"/><path d="M6 8h12"/></g></symbol>
  <symbol id="ic-scrap" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l3-5h10l3 5z"/><path d="M7.5 12l2-3h5l2 3"/></g></symbol>
  <symbol id="ic-shard" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l4.5 7.5L12 22l-4.5-12.5z"/></g></symbol>
  <symbol id="ic-fuel" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6 6 10a6 6 0 11-12 0c0-4 6-10 6-10z"/></g></symbol>
  <symbol id="ic-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3l2.6 6.2 6.4.6-4.8 4.3 1.4 6.3L12 17l-5.6 3.4 1.4-6.3L3 9.8l6.4-.6z"/></symbol>

  <symbol id="ic-deploy" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 17V8m0 0l-3.5 3.5M12 8l3.5 3.5"/></g></symbol>
  <symbol id="ic-summon" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2.2 2.2M16.8 16.8L19 19M19 5l-2.2 2.2M7.2 16.8L5 19"/></g></symbol>
  <symbol id="ic-armory" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></g></symbol>
  <symbol id="ic-system" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="7" cy="17" r="2"/></g></symbol>
</svg>

<noscript>
  <div id="fatal">
    <h1>JAVASCRIPT IS DISABLED</h1>
    <p>Nova Drift runs entirely in a local web view and needs JavaScript enabled.</p>
  </div>
</noscript>

<!-- Shown until the game paints. If this is still on screen, boot failed
     before render and the error panel will say why. -->
<div id="boot">
  <div class="mark">NOVA DRIFT</div>
  <div class="bar"><i></i></div>
  <div>INITIALISING</div>
</div>

<div id="app">
  <header id="hud"></header>
  <main id="screen"></main>
  <nav id="nav"></nav>
</div>

<div id="overlay" class="overlay hidden"></div>
<div id="toast" class="toast"></div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/state.js"></script>
<script src="js/gacha.js"></script>
<script src="js/missions.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
